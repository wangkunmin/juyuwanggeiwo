# 局域网给我 —— 容器化任务编排
#
# 用法（在仓库根目录）：
#   docker compose -f docker/compose.yaml build rust-test
#   docker compose -f docker/compose.yaml run --rm rust-test
#   docker compose -f docker/compose.yaml run --rm dart-test
#   docker compose -f docker/compose.yaml run --rm dev        # 进入交互 shell
#
# 国内网络：Docker Hub 直连可能不通，构建时传镜像源
#   REGISTRY=docker.m.daocloud.io docker compose -f docker/compose.yaml build rust-test
#
# 所有服务都挂载宿主仓库到 /src，因此 `run` 时用的永远是宿主上最新的代码；
# 缓存卷（cargo 注册表/target、pub 缓存、gradle）跨次复用，避免重复下载与全量编译。

name: juyuwanggeiwo

services:
  # ---------- Rust：类型检查（开发内循环，最快） ----------
  rust-check:
    # 基于工具链基础层：镜像只装工具链，编译在 `run` 时进行并写入 cargo-* 卷，
    # 因此反复运行是增量的（Dockerfile 里的 rust-check/rust-test target 用于
    # 一次性的“构建即验证”，见 docker/README.md）
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: rust
      args:
        REGISTRY: ${REGISTRY:-docker.io}
        RUST_TOOLCHAIN: ${RUST_TOOLCHAIN:-1.97.1}
        RUSTUP_DIST_SERVER: ${RUSTUP_DIST_SERVER:-https://static.rust-lang.org}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
        CARGO_MIRROR: ${CARGO_MIRROR:-}
        FLUTTER_SDK_BASE_URL: ${FLUTTER_SDK_BASE_URL:-https://storage.googleapis.com}
        FLUTTER_STORAGE_BASE_URL: ${FLUTTER_STORAGE_BASE_URL:-https://storage.googleapis.com}
        PUB_HOSTED_URL: ${PUB_HOSTED_URL:-https://pub.dev}
    image: lsg-rust-check
    working_dir: /src
    volumes:
      - ..:/src
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/src/target
    # --all-targets 连测试与示例一起类型检查，改名/协议改动最容易在这里暴露
    command: ["bash", "-c", "cd packages/core && cargo check --features full --all-targets"]

  # ---------- Rust：与 CI rust job 对齐的完整测试 ----------
  rust-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: rust
      args:
        REGISTRY: ${REGISTRY:-docker.io}
        RUST_TOOLCHAIN: ${RUST_TOOLCHAIN:-1.97.1}
        RUSTUP_DIST_SERVER: ${RUSTUP_DIST_SERVER:-https://static.rust-lang.org}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
        CARGO_MIRROR: ${CARGO_MIRROR:-}
        FLUTTER_SDK_BASE_URL: ${FLUTTER_SDK_BASE_URL:-https://storage.googleapis.com}
        FLUTTER_STORAGE_BASE_URL: ${FLUTTER_STORAGE_BASE_URL:-https://storage.googleapis.com}
        PUB_HOSTED_URL: ${PUB_HOSTED_URL:-https://pub.dev}
    image: lsg-rust-test
    working_dir: /src
    volumes:
      - ..:/src
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/src/target
    # 与 CI 的 rust job 对齐：clippy(core, --all-targets) + core 测试 + server 测试 +
    # 插件与 CLI 的 cargo check
    command:
      - bash
      - -c
      - |
        set -e
        cd packages/core && cargo clippy --features full --all-targets
        cargo test --features full
        cd /src && cargo test --package server
        cargo check --package rust_lib_localsend_app --package localsend-cli

  # ---------- Dart/Flutter：格式检查（排除生成目录 lib/gen） ----------
  dart-format:
    # Flutter 的 Linux SDK 只有 x86_64；arm64 宿主需开启 x86_64 模拟（Rosetta）
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: flutter-base
      args:
        REGISTRY: ${REGISTRY:-docker.io}
        RUST_TOOLCHAIN: ${RUST_TOOLCHAIN:-1.97.1}
        RUSTUP_DIST_SERVER: ${RUSTUP_DIST_SERVER:-https://static.rust-lang.org}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
        CARGO_MIRROR: ${CARGO_MIRROR:-}
        FLUTTER_SDK_BASE_URL: ${FLUTTER_SDK_BASE_URL:-https://storage.googleapis.com}
        FLUTTER_STORAGE_BASE_URL: ${FLUTTER_STORAGE_BASE_URL:-https://storage.googleapis.com}
        PUB_HOSTED_URL: ${PUB_HOSTED_URL:-https://pub.dev}
    image: lsg-dart-format
    working_dir: /src
    volumes:
      - ..:/src
      - pub-cache:/root/.pub-cache
    command: ["bash", "-c", "cd app && rm -rf lib/gen && dart format --set-exit-if-changed lib test"]

  # ---------- Dart/Flutter：分析 + 测试（app 与 isolates 两个包） ----------
  dart-test:
    # Flutter 的 Linux SDK 只有 x86_64；arm64 宿主需开启 x86_64 模拟（Rosetta）
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: flutter-base
      args:
        REGISTRY: ${REGISTRY:-docker.io}
        RUST_TOOLCHAIN: ${RUST_TOOLCHAIN:-1.97.1}
        RUSTUP_DIST_SERVER: ${RUSTUP_DIST_SERVER:-https://static.rust-lang.org}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
        CARGO_MIRROR: ${CARGO_MIRROR:-}
        FLUTTER_SDK_BASE_URL: ${FLUTTER_SDK_BASE_URL:-https://storage.googleapis.com}
        FLUTTER_STORAGE_BASE_URL: ${FLUTTER_STORAGE_BASE_URL:-https://storage.googleapis.com}
        PUB_HOSTED_URL: ${PUB_HOSTED_URL:-https://pub.dev}
    image: lsg-dart-test
    working_dir: /src
    volumes:
      - ..:/src
      - pub-cache:/root/.pub-cache
    # 注意用 `bash -c`：登录 shell(-lc) 会加载 /etc/profile 并重置 PATH，
    # 从而丢掉 /opt/flutter/bin 与 /usr/local/cargo/bin
    command:
      - bash
      - -c
      - |
        set -e
        cd app
        flutter pub get
        flutter analyze
        flutter test
        cd ../packages/localsend_isolates
        flutter pub get
        # 只分析自有代码：rust_builder/cargokit 是随包附带的构建工具，
        # 不参与 pub 工作区解析（AGENTS.md），其中 45 个 uri_does_not_exist 为既有噪声
        flutter analyze lib test
        flutter test

  # ---------- FRB 代码生成（生成物会写回宿主仓库） ----------
  codegen:
    # 不依赖 Flutter（见 Dockerfile 说明），因此可在宿主架构原生运行
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: codegen
      args:
        REGISTRY: ${REGISTRY:-docker.io}
        RUST_TOOLCHAIN: ${RUST_TOOLCHAIN:-1.97.1}
        RUSTUP_DIST_SERVER: ${RUSTUP_DIST_SERVER:-https://static.rust-lang.org}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
        CARGO_MIRROR: ${CARGO_MIRROR:-}
        FLUTTER_SDK_BASE_URL: ${FLUTTER_SDK_BASE_URL:-https://storage.googleapis.com}
        FLUTTER_STORAGE_BASE_URL: ${FLUTTER_STORAGE_BASE_URL:-https://storage.googleapis.com}
        PUB_HOSTED_URL: ${PUB_HOSTED_URL:-https://pub.dev}
        DART_SDK_BASE_URL: ${DART_SDK_BASE_URL:-https://storage.googleapis.com}
        DART_VERSION: ${DART_VERSION:-3.11.5}
        FRB_BASE_URL: ${FRB_BASE_URL:-https://github.com/fzyzcjy/flutter_rust_bridge/releases/download}
    image: lsg-codegen
    working_dir: /src
    volumes:
      - ..:/src
      - pub-cache:/root/.pub-cache
    # 该镜像不含 Flutter（codegen 不需要它），因此不跑 flutter pub get；
    # 依赖解析结果由 dart-build-runner / dart-test 服务负责，这里直接生成。
    command: ["bash", "-c", "cd packages/localsend_isolates && flutter_rust_bridge_codegen generate --no-deps-check"]

  # ---------- Dart 代码生成（dart_mappable / freezed / flutter_gen / slang） ----------
  # 改动模型或 i18n 后运行，生成物会写回宿主仓库
  dart-build-runner:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: flutter-base
      args:
        REGISTRY: ${REGISTRY:-docker.io}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
        FLUTTER_SDK_BASE_URL: ${FLUTTER_SDK_BASE_URL:-https://storage.googleapis.com}
        FLUTTER_STORAGE_BASE_URL: ${FLUTTER_STORAGE_BASE_URL:-https://storage.googleapis.com}
        PUB_HOSTED_URL: ${PUB_HOSTED_URL:-https://pub.dev}
    image: lsg-dart-build-runner
    working_dir: /src
    volumes:
      - ..:/src
      - pub-cache:/root/.pub-cache
    command:
      - bash
      - -c
      - |
        set -e
        cd app
        flutter pub get
        dart run build_runner build --delete-conflicting-outputs
        dart run slang
        cd ../packages/localsend_isolates
        flutter pub get
        dart run build_runner build --delete-conflicting-outputs

  # ---------- 发布前：版本一致性检查（pubspec/inno/cli/msix/appimage） ----------
  version-check:
    # Flutter 的 Linux SDK 只有 x86_64；arm64 宿主需开启 x86_64 模拟（Rosetta）
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: version-check
      args:
        REGISTRY: ${REGISTRY:-docker.io}
        RUST_TOOLCHAIN: ${RUST_TOOLCHAIN:-1.97.1}
        RUSTUP_DIST_SERVER: ${RUSTUP_DIST_SERVER:-https://static.rust-lang.org}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
        CARGO_MIRROR: ${CARGO_MIRROR:-}
        FLUTTER_SDK_BASE_URL: ${FLUTTER_SDK_BASE_URL:-https://storage.googleapis.com}
        FLUTTER_STORAGE_BASE_URL: ${FLUTTER_STORAGE_BASE_URL:-https://storage.googleapis.com}
        PUB_HOSTED_URL: ${PUB_HOSTED_URL:-https://pub.dev}
    image: lsg-version-check
    working_dir: /src
    volumes:
      - ..:/src

  # ---------- Android APK 打包 ----------
  android-apk:
    # Flutter 的 Linux SDK 只有 x86_64；arm64 宿主需开启 x86_64 模拟（Rosetta）
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: android-apk
      args:
        REGISTRY: ${REGISTRY:-docker.io}
        RUST_TOOLCHAIN: ${RUST_TOOLCHAIN:-1.97.1}
        RUSTUP_DIST_SERVER: ${RUSTUP_DIST_SERVER:-https://static.rust-lang.org}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
        CARGO_MIRROR: ${CARGO_MIRROR:-}
        FLUTTER_SDK_BASE_URL: ${FLUTTER_SDK_BASE_URL:-https://storage.googleapis.com}
        FLUTTER_STORAGE_BASE_URL: ${FLUTTER_STORAGE_BASE_URL:-https://storage.googleapis.com}
        PUB_HOSTED_URL: ${PUB_HOSTED_URL:-https://pub.dev}
        # Flutter 3.41.9 期望 28.2.13676358（见 gradle_utils.dart 的 const ndkVersion）
        NDK_VERSION: ${NDK_VERSION:-28.2.13676358}
    image: lsg-android
    working_dir: /src
    # flutter 的更新检查会 `git fetch --tags`（github.com）；在受限网络里会让构建
    # 无限期挂起。命令里统一加 --no-version-check（flutter_command_runner 的
    # kVersionCheckFlag），这里再把 github 解析到本地，令任何漏网的访问立刻失败
    # 而不是挂起。
    extra_hosts:
      - "github.com:127.0.0.1"
      - "codeload.github.com:127.0.0.1"
    volumes:
      - ..:/src
      - pub-cache:/root/.pub-cache
      - gradle:/root/.gradle
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/src/target
    # 产物：app/build/app/outputs/flutter-apk/app-release.apk（直接落在宿主仓库里）
    # x86_64 模拟（Rosetta）下 Gradle 的原生文件监听会失败并卡住构建，
    # 因此先确保关闭 VFS watch，再打包
    command:
      - bash
      - -c
      - |
        set -e
        mkdir -p /root/.gradle
        # 模拟环境（Rosetta）下：原生文件监听不可用，且 HotSpot 的 perf data 会触发
        # SIGBUS 崩溃（PerfLongVariant::sample）；这里把两项设置幂等写入
        {
          grep -v -E "^org.gradle.(vfs.watch|jvmargs)=" /root/.gradle/gradle.properties 2>/dev/null || true
          echo "org.gradle.vfs.watch=false"
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:-UsePerfData"
        } > /root/.gradle/gradle.properties.new
        mv /root/.gradle/gradle.properties.new /root/.gradle/gradle.properties
        cd app
        # --no-version-check：跳过联网更新检查（否则 flutter 会 git fetch --tags 卡住）
        flutter --no-version-check pub get
        flutter --no-version-check build apk --release

  # ---------- Linux 桌面打包 ----------
  linux-app:
    # Flutter 的 Linux SDK 只有 x86_64；arm64 宿主需开启 x86_64 模拟（Rosetta）
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: linux-app
      args:
        REGISTRY: ${REGISTRY:-docker.io}
        RUST_TOOLCHAIN: ${RUST_TOOLCHAIN:-1.97.1}
        RUSTUP_DIST_SERVER: ${RUSTUP_DIST_SERVER:-https://static.rust-lang.org}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
        CARGO_MIRROR: ${CARGO_MIRROR:-}
        FLUTTER_SDK_BASE_URL: ${FLUTTER_SDK_BASE_URL:-https://storage.googleapis.com}
        FLUTTER_STORAGE_BASE_URL: ${FLUTTER_STORAGE_BASE_URL:-https://storage.googleapis.com}
        PUB_HOSTED_URL: ${PUB_HOSTED_URL:-https://pub.dev}
    image: lsg-linux
    working_dir: /src
    volumes:
      - ..:/src
      - pub-cache:/root/.pub-cache
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/src/target
    command: ["bash", "-c", "cd app && flutter build linux --release"]

  # ---------- 交互开发：Rust + Flutter + Android SDK + FRB codegen ----------
  dev:
    # Flutter 的 Linux SDK 只有 x86_64；arm64 宿主需开启 x86_64 模拟（Rosetta）
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
      args:
        REGISTRY: ${REGISTRY:-docker.io}
        RUST_TOOLCHAIN: ${RUST_TOOLCHAIN:-1.97.1}
        RUSTUP_DIST_SERVER: ${RUSTUP_DIST_SERVER:-https://static.rust-lang.org}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
        CARGO_MIRROR: ${CARGO_MIRROR:-}
        FLUTTER_SDK_BASE_URL: ${FLUTTER_SDK_BASE_URL:-https://storage.googleapis.com}
        FLUTTER_STORAGE_BASE_URL: ${FLUTTER_STORAGE_BASE_URL:-https://storage.googleapis.com}
        PUB_HOSTED_URL: ${PUB_HOSTED_URL:-https://pub.dev}
    image: lsg-dev
    working_dir: /src
    volumes:
      - ..:/src
      - pub-cache:/root/.pub-cache
      - gradle:/root/.gradle
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/src/target
    command: ["bash"]

volumes:
  cargo-registry:
  cargo-target:
  pub-cache:
  gradle:
