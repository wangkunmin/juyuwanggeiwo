# 构建 Android APK（本仓库专用：**不需要任何密钥/secret**）
#
# 与上游的 build_android_apk.yml 的区别：
#   - 上游依赖 ANDROID_KEY_PROPERTIES / ANDROID_KEY_STORE 两个 secrets 做发布签名；
#     本工作流在 CI 内生成一次性自签证书，因此无需配置任何 secret 即可出包。
#   - 额外的安全网：强制使用锁定依赖（--enforce-lockfile），并断言
#     flutter_rust_bridge 的「生成代码版本 / 锁文件版本 / 实际解析版本」三者一致。
#     三者不一致会让 App 启动即崩（曾出过 codegen 2.12.0 与 runtime 2.13.0 的错配）。
#
# 触发：手动 Run workflow，或推送 v* 标签。
# 产物：三个 ABI 的 release APK，同时发布到 GitHub Release 与 Gitee Release（后者需
#       GITEE_TOKEN 密钥）。若配置了 ANDROID_KEYSTORE_BASE64 等密钥，会复用正式证书，
#       保证与已发布包同签名（可直接覆盖安装）。
#
# 说明：Linux runner 是原生 x86_64，不需要模拟，通常 6–10 分钟完成；公开仓库免费、
#       私有仓库消耗 Linux 分钟（1×），本工作流一次约 8–10 分钟。

name: Build Android APK (fork, no secrets)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GITEE_REPO: ynzj/juyuwanggeiwo
  RELEASE_TAG: v1.18.2-resume.1
  # 与已发布包一致的 versionCode 基数（645 → arm64 6453 / v7a 6451 / x86 6454），
  # 保证 CI 产物与发布包同 versionCode 且同签名，可直接覆盖安装。
  APK_BUILD_NUMBER: "645"

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # 标准 ubuntu runner 可用空间只有约 14GB，而 Android 构建要装 NDK + 为三个 ABI
      # 交叉编译 Rust + Gradle 缓存，实测会写满磁盘（第二次失败即 No space left on device，
      # 连运行日志都生成不出来）。这里先删掉 runner 上与本项目无关的预装组件。
      - name: 释放磁盘空间
        run: |
          set -euo pipefail
          echo "清理前："; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android/sdk/ndk \
                      /usr/local/lib/android/sdk/system-images \
                      /usr/local/lib/android/sdk/emulator \
                      /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/local/share/chromium \
                      /opt/microsoft/msedge /usr/lib/firefox /usr/share/swift 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          echo "清理后："; df -h / | tail -1

      - name: 读取 .fvmrc 的 Flutter 版本
        id: versions
        run: |
          set -euo pipefail
          V=$(sed -n 's/.*"flutter": *"\([^"]*\)".*/\1/p' .fvmrc | head -1)
          echo "flutter=$V" >> "$GITHUB_OUTPUT"
          echo "Flutter $V"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.versions.outputs.flutter }}
          channel: stable
          cache: true

      # Android Gradle Plugin 需要 JDK 17；runner 默认是 JDK 11（首次实测就栽在这里）
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # cargokit 在 Gradle 构建期间用 cargo 编译 Rust 插件
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - name: 环境信息
        run: |
          flutter --version
          rustc --version
          echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME" 2>/dev/null | head -5

      # 缓存 Rust 依赖编译结果与 cargo 注册表（三个 ABI 全量编译最耗时）
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/build/**/cargokit_build
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-
            cargo-${{ runner.os }}-

      - name: 解析依赖（强制锁文件）
        run: flutter --no-version-check pub get --enforce-lockfile

      - name: 断言 flutter_rust_bridge 三方版本一致
        run: |
          set -euo pipefail
          CODEGEN=$(grep -oE "codegenVersion => '[0-9]+\.[0-9]+\.[0-9]+'" packages/localsend_isolates/lib/rust/frb_generated.dart | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          LOCKED=$(awk '/^  flutter_rust_bridge:/{f=1} f && /^    version:/{gsub(/[^0-9.]/,""); print; exit}' pubspec.lock)
          RESOLVED=$(grep -oE 'flutter_rust_bridge-[0-9]+\.[0-9]+\.[0-9]+' .dart_tool/package_config.json | head -1 | sed 's/flutter_rust_bridge-//')
          echo "codegen=$CODEGEN lock=$LOCKED resolved=$RESOLVED"
          if [ "$CODEGEN" != "$LOCKED" ] || [ "$LOCKED" != "$RESOLVED" ]; then
            echo "::error::flutter_rust_bridge 版本不一致，产物会启动崩溃"
            exit 1
          fi

      - name: 准备签名（复用已发布包所用证书，保证同签名）
        working-directory: app
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KS_B64:-}" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
              "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              "${{ secrets.ANDROID_KEY_PASSWORD }}" \
              "${{ secrets.ANDROID_KEY_ALIAS }}" \
              "$RUNNER_TEMP/release.jks" > android/key.properties
            echo "已复用正式 keystore（与 Gitee 上已发布的包同签名，可覆盖安装）"
          else
            echo "未配置 keystore 密钥，退回一次性自签证书（与已发布包签名不同！）"
            keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" \
              -storepass cipass -keypass cipass -alias ci \
              -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=CI Build" >/dev/null 2>&1
            printf 'storePassword=cipass\nkeyPassword=cipass\nkeyAlias=ci\nstoreFile=%s\n' \
              "$RUNNER_TEMP/ci.jks" > android/key.properties
          fi

      - name: 打包（三个 ABI 分包）
        working-directory: app
        run: flutter --no-version-check build apk --release --split-per-abi --build-number "$APK_BUILD_NUMBER"

      - name: 统一产物命名（与已发布包一致，便于两处 Release 覆盖更新）
        run: |
          set -euo pipefail
          VER="$(sed -n 's/^version: \([0-9.]*\).*/\1/p' app/pubspec.yaml)"
          cd app/build/app/outputs/flutter-apk
          # 与 versionCode 对应：arm64 6453 / v7a 6451 / x86 6454
          for pair in "arm64-v8a:6453" "armeabi-v7a:6451" "x86_64:6454"; do
            abi="${pair%%:*}"; code="${pair##*:}"
            if [ -f "app-$abi-release.apk" ]; then
              mv "app-$abi-release.apk" "juyuwanggeiwo-$VER-$code-$abi.apk"
              echo "  app-$abi-release.apk → juyuwanggeiwo-$VER-$code-$abi.apk"
            fi
          done
          ls -lh *.apk

      - name: 校验产物并输出校验和
        run: |
          set -euo pipefail
          ls -lh app/build/app/outputs/flutter-apk/*.apk
          shasum -a 256 app/build/app/outputs/flutter-apk/*.apk | sed 's|app/build/app/outputs/flutter-apk/||' | tee SHA256SUMS-android.txt

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            app/build/app/outputs/flutter-apk/*.apk
            SHA256SUMS-android.txt
          if-no-files-found: error

      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "局域网给我 $TAG" --notes-file docs/release-notes-v1.18.2-resume.1.md
          fi
          files=""
          for f in app/build/app/outputs/flutter-apk/*.apk SHA256SUMS-android.txt; do
            [ -e "$f" ] && files="$files $f"
          done
          [ -n "$files" ] || { echo "没有可发布的文件"; exit 1; }
          gh release upload "$TAG" $files --clobber

      - name: 发布到 Gitee Release（失败不影响 GitHub 发布）
        continue-on-error: true
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          bash support/scripts/publish_gitee_release.sh app/build/app/outputs/flutter-apk/*.apk SHA256SUMS-android.txt
