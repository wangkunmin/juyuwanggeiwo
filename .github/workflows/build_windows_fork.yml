# 构建 Windows 安装包并发布到 Gitee Release（本仓库专用，不需要任何 upstream 密钥）
#
# 产物：
#   - juyuwanggeiwo-<版本>-windows-x64.zip          绿色版（解压即用）
#   - juyuwanggeiwo-<版本>-windows-x64-setup.exe    Inno Setup 安装包（尽力而为）
#
# 发布：构建完成后通过 Gitee Open API 上传到 Release（需仓库密钥 GITEE_TOKEN）。
#      未配置该密钥时只上传到 Actions Artifacts，不影响构建。
#
# 说明：Flutter 的 Windows 构建必须在 Windows 上完成（需要 MSVC + Windows SDK），
#      Linux/macOS 无法替代；GitHub 的 windows-latest runner 已预装这些工具链。

name: Build Windows packages (fork)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_TAG: v1.18.2-resume.1

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 读取 .fvmrc 的 Flutter 版本
        shell: bash
        id: versions
        run: |
          set -euo pipefail
          V=$(sed -n 's/.*"flutter": *"\([^"]*\)".*/\1/p' .fvmrc | head -1)
          P=$(sed -n 's/^version: \([0-9.]*\).*/\1/p' app/pubspec.yaml)
          echo "flutter=$V" >> $GITHUB_OUTPUT
          echo "appver=$P" >> $GITHUB_OUTPUT
          echo "Flutter $V / app $P"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.versions.outputs.flutter }}
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - name: 环境信息
        shell: bash
        run: |
          flutter --version
          rustc --version

      - name: 解析依赖（强制锁文件）
        shell: bash
        run: flutter --no-version-check pub get --enforce-lockfile

      - name: 断言 flutter_rust_bridge 三方版本一致
        shell: bash
        run: |
          set -euo pipefail
          CODEGEN=$(grep -oE "codegenVersion => '[0-9]+\.[0-9]+\.[0-9]+'" packages/localsend_isolates/lib/rust/frb_generated.dart | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          LOCKED=$(awk '/^  flutter_rust_bridge:/{f=1} f && /^    version:/{gsub(/[^0-9.]/,""); print; exit}' pubspec.lock)
          RESOLVED=$(grep -oE 'flutter_rust_bridge-[0-9]+\.[0-9]+\.[0-9]+' .dart_tool/package_config.json | head -1 | sed 's/flutter_rust_bridge-//')
          echo "codegen=$CODEGEN lock=$LOCKED resolved=$RESOLVED"
          if [ "$CODEGEN" != "$LOCKED" ] || [ "$LOCKED" != "$RESOLVED" ]; then
            echo "::error::flutter_rust_bridge 版本不一致，产物会启动崩溃"; exit 1
          fi

      # app/windows/CMakeLists.txt 的 install 步骤要求存在 juyuwanggeiwo_msix_helper.msix，
      # 但仓库里只有素材（support/build/msix/），必须先用 Windows SDK 的 makepri/makeappx 生成。
      # 首次构建失败即为此：INSTALL 的 PostBuildEvent 因缺文件报 MSB3073，且 MSBuild 不显示真实原因。
      - name: 生成 MSIX helper
        shell: pwsh
        run: |
          $makepri = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\makepri.exe' | Select-Object -Last 1
          if (-not $makepri) { throw "未找到 makepri.exe" }
          & $makepri.FullName new /pr support\build\msix\content /cf support\build\msix\priconfig.xml /mn support\build\msix\content\AppxManifest.xml /of support\build\msix\content\resources.pri /o
          & 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\makeappx.exe' pack /o /d support\build\msix\content /nv /p app\windows\juyuwanggeiwo_msix_helper.msix
          if (-not (Test-Path 'app\windows\juyuwanggeiwo_msix_helper.msix')) { throw "MSIX helper 生成失败" }
          Get-Item 'app\windows\juyuwanggeiwo_msix_helper.msix' | Select-Object Name, Length

      - name: 构建 Windows 应用
        shell: bash
        working-directory: app
        # -v：MSBuild 会把 cargokit(cargo) 的失败包装成 MSB3073 而看不到真实原因，
        # 加 verbose 才能定位（首次失败即为此）。
        run: flutter --no-version-check build windows --release -v

      - name: 打包绿色版 zip
        shell: pwsh
        run: |
          $ver = "${{ steps.versions.outputs.appver }}"
          $src = "app\build\windows\x64\runner\Release"
          if (-not (Test-Path $src)) { throw "找不到构建产物 $src" }
          $zip = "juyuwanggeiwo-$ver-windows-x64.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $zip -Force
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash
          "$h  $zip" | Out-File -FilePath SHA256SUMS.txt -Encoding utf8 -Append

      - name: 生成 Inno Setup 安装包（尽力而为）
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $ver = "${{ steps.versions.outputs.appver }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "未找到 ISCC" }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          & $iscc "/DPayloadDir=$PWD\app\build\windows\x64\runner\Release" "/DResultDir=$PWD\out" "/DMyAppVersion=$ver" "support\scripts\compile_windows_exe-inno.iss"
          Get-ChildItem out -Filter *.exe | ForEach-Object {
            $dst = "juyuwanggeiwo-$ver-windows-x64-setup.exe"
            Move-Item $_.FullName $dst -Force
            $h = (Get-FileHash $dst -Algorithm SHA256).Hash
            "$h  $dst" | Out-File -FilePath SHA256SUMS.txt -Encoding utf8 -Append
          }

      - name: 结果清单
        shell: bash
        run: ls -lh *.zip *.exe SHA256SUMS.txt 2>/dev/null || ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            *.zip
            *.exe
            SHA256SUMS.txt
          if-no-files-found: error

      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${ secrets.GITHUB_TOKEN }
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          NOTES="docs/release-notes-v1.18.2-resume.1.md"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "局域网给我 $TAG" --notes-file "$NOTES"
          fi
          # 只上传真实存在的文件：像 *.AppImage / *.exe 这类可选产物缺失时，
          # 直接把它们写进 gh 参数会让整个发布步骤失败（Linux 首次即栽在这里）。
          files=""
          for f in "*.zip" "*.exe" "SHA256SUMS.txt"; do [ -e "$f" ] && files="$files $f"; done
          [ -n "$files" ] || { echo "没有可发布的文件"; exit 1; }
          gh release upload "$TAG" $files --clobber
          echo "已发布到 GitHub Release：$TAG"