# 构建 Linux 安装包并发布到 Gitee Release（本仓库专用，不需要任何 upstream 密钥）
#
# 产物：
#   - juyuwanggeiwo-<版本>-linux-x64.tar.gz     绿色版（解压后运行 juyuwanggeiwo）
#   - juyuwanggeiwo-<版本>-linux-x64.AppImage   若打包脚本可用则一并产出（尽力而为）
#
# 发布：完成后通过 Gitee Open API 上传到 Release（需仓库密钥 GITEE_TOKEN）。
#
# 说明：Flutter 的 Linux 桌面构建需要 GTK 开发库；GitHub 的 ubuntu runner 上有，
#      但需要先 apt 安装。本地用 Docker 也能构建（见 docker/compose.yaml 的 linux-app）。

name: Build Linux packages (fork)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  GITEE_REPO: ynzj/juyuwanggeiwo
  RELEASE_TAG: v1.18.2-resume.1

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          df -h / | tail -1

      - name: 安装 Linux 桌面构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libblkid-dev libsecret-1-dev
          pkg-config --modversion gtk+-3.0

      - name: 读取 .fvmrc 的 Flutter 版本
        id: versions
        run: |
          set -euo pipefail
          V=$(sed -n 's/.*"flutter": *"\([^"]*\)".*/\1/p' .fvmrc | head -1)
          P=$(sed -n 's/^version: \([0-9.]*\).*/\1/p' app/pubspec.yaml)
          echo "flutter=$V" >> $GITHUB_OUTPUT
          echo "appver=$P" >> $GITHUB_OUTPUT
          echo "Flutter $V / app $P"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.versions.outputs.flutter }}
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - name: 解析依赖（强制锁文件）
        run: flutter --no-version-check pub get --enforce-lockfile

      - name: 断言 flutter_rust_bridge 三方版本一致
        run: |
          set -euo pipefail
          CODEGEN=$(grep -oE "codegenVersion => '[0-9]+\.[0-9]+\.[0-9]+'" packages/localsend_isolates/lib/rust/frb_generated.dart | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          LOCKED=$(awk '/^  flutter_rust_bridge:/{f=1} f && /^    version:/{gsub(/[^0-9.]/,""); print; exit}' pubspec.lock)
          RESOLVED=$(grep -oE 'flutter_rust_bridge-[0-9]+\.[0-9]+\.[0-9]+' .dart_tool/package_config.json | head -1 | sed 's/flutter_rust_bridge-//')
          echo "codegen=$CODEGEN lock=$LOCKED resolved=$RESOLVED"
          if [ "$CODEGEN" != "$LOCKED" ] || [ "$LOCKED" != "$RESOLVED" ]; then
            echo "::error::flutter_rust_bridge 版本不一致，产物会启动崩溃"; exit 1
          fi

      - name: 构建 Linux 应用
        working-directory: app
        run: flutter --no-version-check build linux --release

      - name: 打包 tar.gz
        run: |
          set -euo pipefail
          VER="${{ steps.versions.outputs.appver }}"
          SRC="app/build/linux/x64/release/bundle"
          test -d "$SRC" || { echo "::error::找不到 $SRC"; exit 1; }
          OUT="juyuwanggeiwo-$VER-linux-x64"
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp -r "$SRC"/* "$OUT"/
          tar czf "$OUT.tar.gz" "$OUT"
          shasum -a 256 "$OUT.tar.gz" | tee SHA256SUMS.txt
          ls -lh "$OUT.tar.gz"

      - name: 尝试打 AppImage（尽力而为）
        continue-on-error: true
        run: |
          bash support/scripts/compile_linux_appimage.sh || echo "AppImage 脚本未成功，忽略（tar.gz 已可用）"
          ls -lh *.AppImage 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            *.tar.gz
            *.AppImage
            SHA256SUMS.txt
          if-no-files-found: error

      - name: 发布到 Gitee Release
        if: ${{ env.GITEE_TOKEN != '' }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: bash support/scripts/publish_gitee_release.sh *.tar.gz *.AppImage SHA256SUMS.txt
