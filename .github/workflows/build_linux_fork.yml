# 构建 Linux 安装包并发布到 Gitee Release（本仓库专用，不需要任何 upstream 密钥）
#
# 产物：
#   - juyuwanggeiwo-<版本>-linux-x64.tar.gz     绿色版（解压后运行 juyuwanggeiwo）
#   - juyuwanggeiwo-<版本>-linux-x64.AppImage   若打包脚本可用则一并产出（尽力而为）
#
# 发布：完成后通过 Gitee Open API 上传到 Release（需仓库密钥 GITEE_TOKEN）。
#
# 说明：Flutter 的 Linux 桌面构建需要 GTK 开发库；GitHub 的 ubuntu runner 上有，
#      但需要先 apt 安装。本地用 Docker 也能构建（见 docker/compose.yaml 的 linux-app）。

name: Build Linux packages (fork)

on:
  # 只手动触发：避免打标签时三个平台一起跑、白烧额度（macOS 按 10× 计费）
  workflow_dispatch:
  # 公开仓库下标准 runner 免费且不限量，因此允许打标签自动出全平台包
  push:
    tags:
      - "v*"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  RELEASE_TAG: v1.18.2-resume.1

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          df -h / | tail -1

      - name: 安装 Linux 桌面构建依赖
        run: |
          sudo apt-get update -qq
          # tray_manager 需要 ayatana-appindicator3（首次构建就栽在这里：
          #   "The `tray_manager` package requires ayatana-appindicator3-0.1 or appindicator3-0.1"）
          sudo apt-get install -y -qq --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libblkid-dev \
            libsecret-1-dev libayatana-appindicator3-dev libnotify-dev
          pkg-config --modversion gtk+-3.0

      - name: 读取 .fvmrc 的 Flutter 版本
        id: versions
        run: |
          set -euo pipefail
          V=$(sed -n 's/.*"flutter": *"\([^"]*\)".*/\1/p' .fvmrc | head -1)
          P=$(sed -n 's/^version: \([0-9.]*\).*/\1/p' app/pubspec.yaml)
          echo "flutter=$V" >> $GITHUB_OUTPUT
          echo "appver=$P" >> $GITHUB_OUTPUT
          echo "Flutter $V / app $P"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.versions.outputs.flutter }}
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      # 缓存 Rust 依赖编译结果（cargokit 的产物）与 cargo 注册表：
      # macOS/Windows 一次全量编译 Rust 依赖就要 8–12 分钟，这是最贵的部分。
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/build/macos/**/cargokit_build
            app/build/windows/**/cargokit_build
            app/build/linux/**/cargokit_build
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-
            cargo-${{ runner.os }}-

      - name: 解析依赖（强制锁文件）
        run: flutter --no-version-check pub get --enforce-lockfile

      - name: 断言 flutter_rust_bridge 三方版本一致
        run: |
          set -euo pipefail
          CODEGEN=$(grep -oE "codegenVersion => '[0-9]+\.[0-9]+\.[0-9]+'" packages/localsend_isolates/lib/rust/frb_generated.dart | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          LOCKED=$(awk '/^  flutter_rust_bridge:/{f=1} f && /^    version:/{gsub(/[^0-9.]/,""); print; exit}' pubspec.lock)
          RESOLVED=$(grep -oE 'flutter_rust_bridge-[0-9]+\.[0-9]+\.[0-9]+' .dart_tool/package_config.json | head -1 | sed 's/flutter_rust_bridge-//')
          echo "codegen=$CODEGEN lock=$LOCKED resolved=$RESOLVED"
          if [ "$CODEGEN" != "$LOCKED" ] || [ "$LOCKED" != "$RESOLVED" ]; then
            echo "::error::flutter_rust_bridge 版本不一致，产物会启动崩溃"; exit 1
          fi

      - name: 构建 Linux 应用
        working-directory: app
        run: flutter --no-version-check build linux --release

      - name: 打包 tar.gz
        run: |
          set -euo pipefail
          VER="${{ steps.versions.outputs.appver }}"
          SRC="app/build/linux/x64/release/bundle"
          test -d "$SRC" || { echo "::error::找不到 $SRC"; exit 1; }
          OUT="juyuwanggeiwo-$VER-linux-x64"
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp -r "$SRC"/* "$OUT"/
          tar czf "$OUT.tar.gz" "$OUT"
          shasum -a 256 "$OUT.tar.gz" | tee SHA256SUMS.txt
          ls -lh "$OUT.tar.gz"

      - name: 尝试打 AppImage（尽力而为）
        continue-on-error: true
        run: |
          bash support/scripts/compile_linux_appimage.sh || echo "AppImage 脚本未成功，忽略（tar.gz 已可用）"
          ls -lh *.AppImage 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            *.tar.gz
            *.AppImage
            SHA256SUMS.txt
          if-no-files-found: error

      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          NOTES="docs/release-notes-v1.18.2-resume.1.md"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "局域网给我 $TAG" --notes-file "$NOTES"
          fi
          # 只上传真实存在的文件：像 *.AppImage / *.exe 这类可选产物缺失时，
          # 直接把它们写进 gh 参数会让整个发布步骤失败（Linux 首次即栽在这里）。
          files=""
          for f in "*.tar.gz" "*.AppImage" "SHA256SUMS.txt"; do [ -e "$f" ] && files="$files $f"; done
          [ -n "$files" ] || { echo "没有可发布的文件"; exit 1; }
          gh release upload "$TAG" $files --clobber
          echo "已发布到 GitHub Release：$TAG"