# 在 macOS runner 上构建「局域网给我」的 macOS 安装包（未签名）
#
# 为什么用 CI：Flutter 的 macOS 构建必须调用 xcodebuild，而 xcodebuild 只有完整
# Xcode 才有；Xcode 只能通过 Apple ID 从 App Store / developer.apple.com 获取。
# GitHub 的 macOS runner **自带 Xcode**，因此不需要任何 Apple ID 就能出包。
#
# 使用前提：
#   1. 本仓库在 GitHub 上有一份镜像（GitHub Actions 只在 GitHub 上运行；
#      Gitee 上无法使用 macOS runner）；
#   2. 不需要 Apple 账号：本项目在 CI 里以「不签名」方式构建，产物仅用于本机测试。
#      正式分发给他人需要自己的 Developer ID + 公证（届时设置下面的环境变量即可）。
#
# 产物：juyuwanggeiwo-<版本>-unsigned.dmg（含 .app，拖到"应用程序"即可运行）
# 首次打开若被 Gatekeeper 拦截，执行：
#   xattr -dr com.apple.quarantine /Applications/juyuwanggeiwo.app

name: Build macOS DMG (unsigned)

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: Flutter 版本（留空则读 .fvmrc）
        required: false
        default: ""
      runner:
        description: 运行器（默认 macos-26-arm64：原生 arm64，比 Intel 快；SDK 需 macOS 26）
        required: false
        default: macos-26-arm64
  # 公开仓库下标准 runner 免费且不限量，因此允许打标签自动出全平台包
  push:
    tags:
      - "v*"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  RELEASE_TAG: v1.18.2-resume.1

jobs:
  macos-dmg:
    runs-on: ${{ inputs.runner || 'macos-26-arm64' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 读取 .fvmrc 里的 Flutter 版本
        id: versions
        run: |
          set -euo pipefail
          FLUTTER_VERSION="${{ inputs.flutter_version }}"
          if [ -z "$FLUTTER_VERSION" ]; then
            FLUTTER_VERSION=$(sed -n 's/.*"flutter": *"\([^"]*\)".*/\1/p' .fvmrc | head -1)
          fi
          echo "flutter=$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"
          echo "使用 Flutter $FLUTTER_VERSION"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.versions.outputs.flutter }}
          channel: stable
          cache: true

      # Rust 工具链：cargokit 在 Xcode 构建期间用 cargo 交叉编译插件。
      # 版本与仓库 rust-toolchain.toml 保持一致。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - name: 环境信息（并选中镜像内最新 Xcode）
        run: |
          set -euo pipefail
          # 依赖例如 connectivity_plus 7.3.1 使用 `#available(macOS 26.0, *)` 的新 API，
          # 需要 macOS 26 SDK；若镜像里装了多个 Xcode，这里选最新的那个。
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$latest" ] && [ "$latest" != "/Applications/Xcode.app" ]; then
            echo "选中 $latest"
            sudo xcode-select -s "$latest"
          fi
          flutter --version
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          rustc --version
          (pod --version || sudo gem install cocoapods --no-document) 2>&1 | tail -2

      # 缓存 Rust 依赖编译结果（cargokit 产物）与 cargo 注册表：
      # 一次全量编译 Rust 依赖要 8–12 分钟，是 macOS 构建里最贵的部分。
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/build/macos/**/cargokit_build
            app/build/windows/**/cargokit_build
            app/build/linux/**/cargokit_build
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-
            cargo-${{ runner.os }}-

      - name: 解析依赖（强制锁文件，避免依赖被静默升级）
        run: flutter pub get --enforce-lockfile

      - name: 断言 flutter_rust_bridge 三方版本一致
        run: |
          set -euo pipefail
          CODEGEN=$(grep -oE "codegenVersion => '[0-9]+\.[0-9]+\.[0-9]+'" packages/localsend_isolates/lib/rust/frb_generated.dart | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          LOCKED=$(awk '/^  flutter_rust_bridge:/{f=1} f && /^    version:/{gsub(/[^0-9.]/,""); print; exit}' pubspec.lock)
          RESOLVED=$(grep -oE 'flutter_rust_bridge-[0-9]+\.[0-9]+\.[0-9]+' .dart_tool/package_config.json | head -1 | sed 's/flutter_rust_bridge-//')
          echo "codegen=$CODEGEN lock=$LOCKED resolved=$RESOLVED"
          [ "$CODEGEN" = "$LOCKED" ] && [ "$LOCKED" = "$RESOLVED" ]

      - name: 构建 macOS App（临时签名，无需 Apple ID）
        working-directory: app
        env:
          # 只把签名身份设为 "-"（本地临时签名，见工程内 CODE_SIGN_IDENTITY 设置），
          # 千万不能设 CODE_SIGNING_ALLOWED=NO：那样主 App 会被临时签名、而子组件
          # （LaunchAtLoginHelper.app / ShareExtension.appex）签名不一致，
          # 结果整包校验失败、双击打不开：
          #   "invalid Info.plist (plist or signature have been modified)"
          #   In subcomponent: .../LoginItems/LaunchAtLoginHelper.app
          CODE_SIGN_IDENTITY: "-"
        run: flutter build macos --release

      # 关键修复 ①：LaunchAtLoginHelper.app（来自 launch_at_startup 的 pod）是**预编译**的，
      # 自带其作者的签名；Xcode 的临时签名不会覆盖它，于是它的 Info.plist 与签名不匹配
      # （codesign: Info.plist=not bound），连带整个 App 校验失败、双击打不开。
      # 关键修复 ②：不能保留 hardened runtime（flags=runtime）。临时签名没有团队 ID，
      # dyld 的 library validation 会拒绝加载框架：
      #   Library not loaded: @rpath/Defaults.framework/... (different Team IDs)
      # 实测：改为纯临时签名（flags=adhoc，无 runtime）后，App 能完整启动
      # （Server started, port 53317）。
      - name: 统一重新临时签名（自内向外）
        run: |
          set -euo pipefail
          APP="app/build/macos/Build/Products/Release/juyuwanggeiwo.app"
          sign() { codesign --force --sign - "$1"; }

          find "$APP/Contents/Frameworks" -maxdepth 1 -name "*.framework" -print0 | \
            while IFS= read -r -d '' f; do sign "$f"; done
          echo "  已重签 $(find "$APP/Contents/Frameworks" -maxdepth 1 -name '*.framework' | wc -l | tr -d ' ') 个 framework"

          HELPER="$APP/Contents/Library/LoginItems/LaunchAtLoginHelper.app"
          if [ -d "$HELPER" ]; then
            for inner in $(find "$HELPER" -type f -perm -u+x -not -path "*/_CodeSignature/*" 2>/dev/null); do
              case "$inner" in *.dylib|*/MacOS/*) sign "$inner" || true ;; esac
            done
            sign "$HELPER"; echo "  已重签 LaunchAtLoginHelper.app"
          fi

          for ex in "$APP/Contents/PlugIns/"*.appex; do
            [ -e "$ex" ] || continue
            for inner in $(find "$ex" -type f -perm -u+x -not -path "*/_CodeSignature/*" 2>/dev/null); do
              case "$inner" in *.dylib|*/MacOS/*) sign "$inner" || true ;; esac
            done
            sign "$ex"; echo "  已重签 $(basename "$ex")"
          done

          sign "$APP"; echo "  已重签主 App"
          codesign -dv "$APP" 2>&1 | grep -E "flags|Signature" || true

      # 这次踩过的坑：能构建成功 ≠ 能打开。打包前强制校验整包签名（含子组件）。
      - name: 校验 App 签名完整性
        run: |
          set -euo pipefail
          APP="app/build/macos/Build/Products/Release/juyuwanggeiwo.app"
          test -d "$APP"
          echo "--- 逐个组件校验 ---"
          fail=0
          while IFS= read -r c; do
            if codesign --verify --strict "$c" 2>/dev/null; then
              echo "  OK   $(basename "$c")"
            else
              echo "  FAIL $(basename "$c")"; fail=1
            fi
          done < <(find "$APP" -maxdepth 4 \( -name "*.app" -o -name "*.appex" -o -name "*.framework" \) -print)
          echo "--- 整包深度校验 ---"
          codesign --verify --deep --strict --verbose=2 "$APP"
          [ "$fail" = 0 ] || { echo "::error::存在签名校验失败的子组件，产物会在 macOS 上打不开"; exit 1; }

      # 能构建、能过签名校验，仍可能在运行时 dyld 加载失败（本次真实踩到）。
      # 这里直接跑一次二进制，只要出现 "Library not loaded" 就判定失败。
      - name: 冒烟运行（拦截 dyld 加载失败）
        run: |
          set -uo pipefail
          APP="app/build/macos/Build/Products/Release/juyuwanggeiwo.app"
          BIN="$APP/Contents/MacOS/$(basename "$APP" .app)"
          "$BIN" > /tmp/smoke.log 2>&1 &
          pid=$!
          sleep 10
          kill "$pid" 2>/dev/null || true
          if grep -q "Library not loaded" /tmp/smoke.log; then
            echo "::error::dyld 加载失败，产物在用户机器上会闪退："
            cat /tmp/smoke.log
            exit 1
          fi
          echo "冒烟通过（未出现 dyld 加载错误）"
          tail -5 /tmp/smoke.log || true

      - name: 打包 DMG
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          APP="app/build/macos/Build/Products/Release/juyuwanggeiwo.app"
          DMG="juyuwanggeiwo-${VERSION}-macos-universal.dmg"
          test -d "$APP"
          rm -f "$DMG"
          hdiutil create -volname "局域网给我" -srcfolder "$APP" -ov -format UDZO "$DMG"
          shasum -a 256 "$DMG" | tee SHA256SUMS-macos.txt

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            *.dmg
            SHA256SUMS-macos.txt
          if-no-files-found: error

      - name: 发布到 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          NOTES="docs/release-notes-v1.18.2-resume.1.md"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "局域网给我 $TAG" --notes-file "$NOTES"
          fi
          # 只上传真实存在的文件：像 *.AppImage / *.exe 这类可选产物缺失时，
          # 直接把它们写进 gh 参数会让整个发布步骤失败（Linux 首次即栽在这里）。
          files=""
          for f in *.dmg SHA256SUMS-macos.txt; do [ -e "$f" ] && files="$files $f"; done
          [ -n "$files" ] || { echo "没有可发布的文件"; exit 1; }
          gh release upload "$TAG" $files --clobber
          echo "已发布到 GitHub Release：$TAG"